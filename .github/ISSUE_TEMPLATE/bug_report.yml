name: Bug Report
description: Report a reproducible Playback problem
title: "[Bug] "
type: bug
body:
  - type: textarea
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Screenshots
      description: If applicable, add sanitized screenshots or videos that help explain the problem.

  - type: textarea
    attributes:
      label: Logs and replay file
      description: Attach sanitized logs and a minimal replay when relevant. Remove server addresses, access tokens, and player information.

  - type: input
    attributes:
      label: Platform
      description: The Windows version you are using. (e.g. Windows 11 24H2)

  - type: input
    attributes:
      label: Minecraft Bedrock Version
      description: The Minecraft Bedrock client version you are using.

  - type: input
    attributes:
      label: LeviLamina Version
      description: The LeviLamina client version you are using. (e.g. 26.10.14)

  - type: input
    attributes:
      label: Playback Version
      description: The Playback version you are using. (e.g. 0.1.0-alpha.1)

  - type: textarea
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
